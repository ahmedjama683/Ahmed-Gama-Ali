{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="narrow card">
  <h1>Change password</h1>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="field">{{ field.label_tag }}{{ field }}{{ field.errors }}</div>
    {% endfor %}
    <button class="btn block" type="submit">Save</button>
  </form>
</div>
{% endblock %}
